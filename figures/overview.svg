<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="331" viewBox="0 0 1120 331" font-family="Arial,sans-serif" role="img"><title>Two monthly files become a replay-safe trip warehouse</title><rect x="0" y="0" width="1120" height="331" rx="0" fill="#fff"/><text x="560" y="52" fill="#102b59" font-size="34" font-weight="700" text-anchor="middle">Two monthly files become a replay-safe trip warehouse</text><rect x="30" y="89" width="253" height="50" rx="24" fill="#102b59"/><text x="156" y="121" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">I. Source acquisition</text><text x="156" y="181" fill="#102b59" font-size="18" font-weight="700" text-anchor="middle">NYC TLC yellow taxis</text><text x="156" y="225" fill="#506078" font-size="17" font-weight="400" text-anchor="middle">2 monthly Parquet files</text><text x="156" y="269" fill="#915883" font-size="17" font-weight="700" text-anchor="middle">Official zone lookup</text><text x="291" y="205" fill="#102b59" font-size="17" font-weight="700" text-anchor="middle">→</text><rect x="299" y="89" width="253" height="50" rx="24" fill="#102b59"/><text x="425" y="121" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">II. Quality checks</text><text x="425" y="181" fill="#102b59" font-size="18" font-weight="700" text-anchor="middle">7,052,769 source rows</text><text x="425" y="225" fill="#506078" font-size="17" font-weight="400" text-anchor="middle">Dates, duration, distance</text><text x="425" y="269" fill="#915883" font-size="17" font-weight="700" text-anchor="middle">196,598 rows rejected</text><text x="560" y="205" fill="#102b59" font-size="17" font-weight="700" text-anchor="middle">→</text><rect x="568" y="89" width="253" height="50" rx="24" fill="#102b59"/><text x="694" y="121" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">III. Incremental load</text><text x="694" y="181" fill="#102b59" font-size="18" font-weight="700" text-anchor="middle">DuckDB daily-ready facts</text><text x="694" y="225" fill="#506078" font-size="17" font-weight="400" text-anchor="middle">6,856,171 accepted trips</text><text x="694" y="269" fill="#915883" font-size="17" font-weight="700" text-anchor="middle">Month + SHA-256 ledger</text><text x="829" y="205" fill="#102b59" font-size="17" font-weight="700" text-anchor="middle">→</text><rect x="837" y="89" width="253" height="50" rx="24" fill="#102b59"/><text x="963" y="121" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">IV. Evidence</text><text x="963" y="181" fill="#102b59" font-size="18" font-weight="700" text-anchor="middle">Borough aggregates</text><text x="963" y="225" fill="#506078" font-size="17" font-weight="400" text-anchor="middle">Replay checks and CSVs</text><text x="963" y="269" fill="#915883" font-size="17" font-weight="700" text-anchor="middle">BigQuery benchmark script</text><rect x="30" y="305" width="1060" height="3" rx="0" fill="#102b59"/></svg>
